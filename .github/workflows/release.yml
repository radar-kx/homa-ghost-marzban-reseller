name: Build cPanel release

on:
  push:
    branches: [main]
    paths: [VERSION, '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homa-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: آماده‌سازی PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, fileinfo, mbstring, pdo_mysql, pdo_sqlite, xml
          tools: composer:v2
          coverage: none

      - name: نصب وابستگی‌ها و اجرای تست‌های Laravel
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --prefer-dist --optimize-autoloader --no-interaction --no-progress
          php artisan test
          php -S 127.0.0.1:8099 -t . >/tmp/homa-web-installer.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8099/install.php | grep -q 'نصب پنل نمایندگی هما گوست'; then
              break
            fi
            if [[ "$attempt" == 10 ]]; then
              cat /tmp/homa-web-installer.log
              exit 1
            fi
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: ساخت بسته نصب
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ARCHIVE="Homa-Ghost-Marzban-Reseller-v${VERSION}.zip"
          mkdir -p dist package
          rsync -a ./ package/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='package' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='RELEASE-CHECKSUMS.txt'
          (cd package && zip -qr "../dist/${ARCHIVE}" .)
          (cd dist && sha256sum "${ARCHIVE}" > "SHA256SUMS-v${VERSION}.txt")

      - name: انتشار Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          ARCHIVE="dist/Homa-Ghost-Marzban-Reseller-${TAG}.zip"
          CHECKSUM="dist/SHA256SUMS-${TAG}.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$CHECKSUM" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$CHECKSUM" \
              --target "${GITHUB_SHA}" \
              --title "Homa Ghost Marzban Reseller ${TAG}" \
              --notes-file CHANGELOG.md
          fi
